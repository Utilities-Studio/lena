glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "**/*.{json,jsonc,md,ts,yaml,yml}"
      run: bun run oxfmt --check {staged_files}
    - name: lint
      glob: "**/*.{js,jsx,ts,tsx}"
      run: bun run oxlint {staged_files}

pre-push:
  jobs:
    - name: check
      run: bun run check
